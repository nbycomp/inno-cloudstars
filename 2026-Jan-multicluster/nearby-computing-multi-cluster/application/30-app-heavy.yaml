apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-heavy
  namespace: nearby-computing-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: simulation
      tier: heavy
  template:
    metadata:
      labels:
        app: simulation
        tier: heavy
      annotations:
        # baseline (your CRU below can still add burst on top if you want)
        kwok.x-k8s.io/usage-cpu: "1500m"
        kwok.x-k8s.io/usage-memory: "6Gi"
    spec:
      nodeSelector:
        type: kwok
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kwok-node-type
                operator: In
                values: ["heavy"]
      tolerations:
      - key: "kwok.x-k8s.io/node"
        operator: "Equal"
        value: "fake"
        effect: "NoSchedule"
      containers:
      - name: c
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
          limits:
            cpu: "8"
            memory: "8Gi"
