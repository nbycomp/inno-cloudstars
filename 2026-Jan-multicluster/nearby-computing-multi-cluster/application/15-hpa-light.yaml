apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simulation-light-hpa
  namespace: nearby-computing-app
spec:
  # Scale the simulation-light Deployment in the same namespace.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simulation-light
  # Keep a small baseline for load spikes, but allow high burst.
  minReplicas: 5
  maxReplicas: 100
  behavior:
    scaleUp:
      # No delay before scaling up when metrics breach target.
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 200
        periodSeconds: 15
      - type: Pods
        value: 50
        periodSeconds: 15
      # Prefer the most aggressive policy when scaling up.
      selectPolicy: Max
    scaleDown:
      # No delay before scaling down when metrics are below target.
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 50
        periodSeconds: 15
      # Prefer the most aggressive policy when scaling down.
      selectPolicy: Max
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        # Deterministic: compare directly to mCPU
        type: AverageValue
        averageValue: "5m"
