apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulation-light
  namespace: nearby-computing-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: simulation
      tier: light
  template:
    metadata:
      labels:
        app: simulation
        tier: light
      annotations:
        # Start low
        kwok.x-k8s.io/usage-cpu: "2m"
        kwok.x-k8s.io/usage-memory: "40Mi"
    spec:
      nodeSelector:
        type: kwok
      tolerations:
      - key: "kwok.x-k8s.io/node"
        operator: "Equal"
        value: "fake"
        effect: "NoSchedule"
      containers:
      - name: c
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"