    {
      "datasource": "${DS}",
      "fieldConfig": {
        "defaults": {
          "unit": "mcores",
          "min": 0
        },
        "overrides": []
      },
      "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
      "id": 1,
      "options": {
        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
        "orientation": "horizontal",
        "textMode": "auto"
      },
      "targets": [
        {
          "expr": "sum(\n  count by (deployment) (\n    label_replace(\n      pod_cpu_usage_seconds_total{job=\"kwok-controller-metrics-discovery\",metrics_name=\"metrics-resource\",namespace=\"$namespace\",pod=~\"simulation-(light|mid|heavy)-.*\"},\n      \"deployment\",\"simulation-$1\",\"pod\",\"simulation-(light|mid|heavy)-.*\"\n    )\n  )\n  * on(deployment) group_left()\n  (\n    label_replace(vector(1500),\"deployment\",\"simulation-heavy\",\"\",\"\")\n    or label_replace(vector(300),\"deployment\",\"simulation-mid\",\"\",\"\")\n    or label_replace(vector(10),\"deployment\",\"simulation-light\",\"\",\"\")\n  )\n)",
          "refId": "A"
        }
      ],
      "title": "Cluster Total CPU (defined, mCores)",
      "type": "stat"
    },

