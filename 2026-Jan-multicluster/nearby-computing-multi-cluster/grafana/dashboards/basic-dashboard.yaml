{
  "annotations": {
    "list": [
      {
        "builtIn": 1,
        "datasource": "-- Grafana --",
        "enable": true,
        "hide": true,
        "iconColor": "rgba(0, 211, 255, 1)",
        "name": "Annotations & Alerts",
        "type": "dashboard"
      }
    ]
  },
  "editable": true,
  "fiscalYearStartMonth": 0,
  "graphTooltip": 1,
  "id": null,
  "links": [],
  "liveNow": false,
  "panels": [
    {
      "datasource": {
        "type": "prometheus",
        "uid": "${ds}"
      },
      "description": "Quick health view of scrape targets by job. 1=UP, 0=DOWN.",
      "fieldConfig": {
        "defaults": {
          "decimals": 0,
          "mappings": [],
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "red", "value": null },
              { "color": "green", "value": 1 }
            ]
          },
          "unit": "short"
        },
        "overrides": []
      },
      "gridPos": { "h": 7, "w": 12, "x": 0, "y": 0 },
      "id": 1,
      "options": {
        "colorMode": "value",
        "graphMode": "none",
        "justifyMode": "center",
        "orientation": "auto",
        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
        "showPercentChange": false,
        "textMode": "name"
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "max by (job) (up)",
          "legendFormat": "{{job}}",
          "refId": "A"
        }
      ],
      "title": "Targets UP by job",
      "type": "stat"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "Total API server request rate (QPS).",
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "gridPos": { "h": 7, "w": 12, "x": 12, "y": 0 },
      "id": 2,
      "options": {
        "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "sum(rate(apiserver_request_total[1m]))",
          "legendFormat": "apiserver QPS",
          "refId": "A"
        }
      ],
      "title": "API server QPS",
      "type": "timeseries"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "API server error rate (4xx + 5xx).",
      "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
      "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 },
      "id": 3,
      "options": {
        "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "sum(rate(apiserver_request_total{code=~\"4..|5..\"}[1m]))",
          "legendFormat": "apiserver error QPS",
          "refId": "A"
        }
      ],
      "title": "API server error QPS (4xx/5xx)",
      "type": "timeseries"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "etcd leader status (should be 1).",
      "fieldConfig": {
        "defaults": {
          "decimals": 0,
          "thresholds": {
            "mode": "absolute",
            "steps": [
              { "color": "red", "value": null },
              { "color": "green", "value": 1 }
            ]
          }
        },
        "overrides": []
      },
      "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 },
      "id": 4,
      "options": {
        "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "max(etcd_server_has_leader)",
          "legendFormat": "etcd has leader",
          "refId": "A"
        }
      ],
      "title": "etcd leader",
      "type": "timeseries"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "Total number of goroutines for key components (Go runtime).",
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
      "id": 5,
      "options": {
        "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "max by (job, instance) (go_goroutines)",
          "legendFormat": "{{job}} {{instance}}",
          "refId": "A"
        }
      ],
      "title": "Go goroutines (by job/instance)",
      "type": "timeseries"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "CPU usage rate of Prometheus-scraped components (process metric).",
      "fieldConfig": { "defaults": { "unit": "cores" }, "overrides": [] },
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
      "id": 6,
      "options": {
        "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "max by (job, instance) (rate(process_cpu_seconds_total[1m]))",
          "legendFormat": "{{job}} {{instance}}",
          "refId": "A"
        }
      ],
      "title": "Process CPU rate (cores)",
      "type": "timeseries"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "Memory RSS for scraped components (process metric).",
      "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
      "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
      "id": 7,
      "options": {
        "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "max by (job, instance) (process_resident_memory_bytes)",
          "legendFormat": "{{job}} {{instance}}",
          "refId": "A"
        }
      ],
      "title": "Process resident memory (RSS)",
      "type": "timeseries"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "Workqueue depth across control-plane components. Useful sanity check that controllers are alive.",
      "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
      "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
      "id": 8,
      "options": {
        "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "topk(10, max by (job, instance, name) (workqueue_depth))",
          "legendFormat": "{{job}} {{name}}",
          "refId": "A"
        }
      ],
      "title": "Workqueue depth (top 10)",
      "type": "timeseries"
    },
    {
      "datasource": { "type": "prometheus", "uid": "${ds}" },
      "description": "Scheduler throughput proxy: count of scheduling duration observations per second.",
      "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
      "gridPos": { "h": 8, "w": 24, "x": 0, "y": 30 },
      "id": 9,
      "options": {
        "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
        "tooltip": { "mode": "single" }
      },
      "pluginVersion": "9.4.7",
      "targets": [
        {
          "expr": "sum(rate(scheduler_e2e_scheduling_duration_seconds_count[1m]))",
          "legendFormat": "scheduler schedule ops/s",
          "refId": "A"
        }
      ],
      "title": "Scheduler activity",
      "type": "timeseries"
    }
  ],
  "refresh": "10s",
  "schemaVersion": 38,
  "style": "dark",
  "tags": ["kwok", "control-plane"],
  "templating": {
    "list": [
      {
        "current": { "selected": false, "text": "kwok-h00-03", "value": "kwok-h00-03" },
        "hide": 0,
        "includeAll": false,
        "label": "Prometheus datasource",
        "multi": false,
        "name": "ds",
        "options": [],
        "query": "prometheus",
        "refresh": 1,
        "regex": "",
        "type": "datasource"
      }
    ]
  },
  "time": { "from": "now-1h", "to": "now" },
  "timepicker": {
    "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"],
    "time_options": ["5m", "15m", "30m", "1h", "6h", "12h", "24h"]
  },
  "timezone": "",
  "title": "KWOK Control Plane Overview",
  "uid": "kwok-control-plane",
  "version": 1
}
